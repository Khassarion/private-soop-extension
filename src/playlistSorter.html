<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재생목록 날짜순 추가</title>
  <link rel="stylesheet" href="options.css">
  <style>
    .sorter-list { list-style: none; padding: 0; margin: 0; }
    .sorter-item { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #eee; }
    .sorter-item .sorter-title { flex: 1; word-break: break-all; }
    .sorter-item .sorter-status { font-size: 12px; min-width: 90px; color: #666; }
    .sorter-item .sorter-status.failed { color: #c0392b; }
    .sorter-item .sorter-status.added { color: #27ae60; }
    .sorter-item .sorter-status.skipped { color: #888; }
    .sorter-item .sorter-status.skipped.in-order { color: #16a34a; font-weight: 600; }
    .sorter-item button { white-space: nowrap; }
    .load-status { font-size: 13px; color: #666; margin: 4px 0; }
    .load-status .tag { font-weight: 600; margin-right: 6px; }

    /* 자동 추가 중엔 목록이 현재 처리 중인 영상 쪽으로 스크롤되므로, 중지 버튼이 있는 이
       컨트롤 영역은 화면 맨 위에 고정해둔다 — 안 그러면 스크롤을 거슬러 올라가야 누를 수 있다. */
    .controls-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: #f4f5f8;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      padding: 16px 0 8px;
    }
    .controls-bar-inner { max-width: 640px; margin: 0 auto; padding: 0 20px; }
    .controls-bar h1 { font-size: 20px; margin-bottom: 12px; }
    .page { padding-top: var(--controls-height, 340px); }
  </style>
</head>
<body>
  <div class="controls-bar" id="controlsBar">
    <div class="controls-bar-inner">
      <h1>🎞️ 재생목록 날짜순 추가</h1>

      <section class="card">
        <div class="card-body">
          <div class="field">
            <label for="playlistSelect">대상 재생목록</label>
            <select id="playlistSelect" disabled>
              <option value="">먼저 "내 재생목록 불러오기"를 눌러주세요</option>
            </select>
          </div>
          <div class="field">
            <label for="phraseInput">제목에 포함된 문구 (비우면 전체)</label>
            <input type="text" id="phraseInput" placeholder="예: 방송 제목 일부">
          </div>
          <div class="field">
            <label class="checkbox-label"><input type="checkbox" id="hideInOrderCheckbox"> 이미 올바른 순서로 들어있는 항목(초록) 숨기기</label>
          </div>
          <div class="input-group">
            <button id="loadBtn" class="btn-primary">영상 목록 불러오기</button>
            <button id="loadPlaylistsBtn" class="btn-primary">내 재생목록 불러오기</button>
            <button id="checkPlaylistBtn" class="btn-primary" disabled>재생목록 조회 (이미 있는지 확인)</button>
            <button id="autoBtn" class="btn-primary" disabled>자동 시작</button>
          </div>
          <p class="load-status"><span class="tag">영상 목록 (Studio 탭)</span><span id="videoLoadStatus"></span></p>
          <p class="load-status"><span class="tag">내 재생목록 (Studio 탭)</span><span id="playlistsLoadStatus"></span></p>
          <p class="load-status"><span class="tag">재생목록 영상 확인 (Studio 탭)</span><span id="playlistLoadStatus"></span></p>
          <p class="empty-hint" id="summary"></p>
        </div>
      </section>
    </div>
  </div>

  <div class="page">
    <section class="card">
      <div class="card-body">
        <ol id="videoList" class="sorter-list"></ol>
      </div>
    </section>
  </div>

  <script type="module" src="playlistSorter.js"></script>
</body>
</html>
